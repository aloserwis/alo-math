function vn(t){return `<div class="vn">${t}</div>`}function levelOf(n){return BANK[n-1].level}function fmtDate(s){return new Date(s).toLocaleString('pl-PL')}
function mastered(id){return !!state.results[id]?.mastered}function doneCount(l){return BANK.filter(q=>(!l||q.level===l)&&mastered(q.id)).length}
function setView(v){view=v;render();scrollTo(0,0)}
function render(){app.className='view view-'+view;document.getElementById('parentBtn').textContent=mode==='parent'?'🔓':'🔒';document.getElementById('parentBtn').classList.toggle('hidden',view==='setup'||view==='unlock');document.getElementById('gradeBtn').classList.toggle('hidden',mode!=='parent'||view==='grades');if(view==='setup')setupPinPage();else if(view==='unlock')parentUnlockPage();else if(view==='grades')gradePicker();else if(view==='home')home();else if(view==='list')list();else if(view==='quiz')quiz();else if(view==='parent')parent();}
function setupPinPage(){app.innerHTML=`<section class="card hero"><h1>Konfiguracja rodzica 🔒</h1>${vn('Bố mẹ hãy đặt PIN để bảo vệ việc đổi lớp và xem kết quả.')}</section><section class="card pinCard"><h2>Ustaw PIN rodzica / Đặt PIN bố mẹ</h2><p>PIN powinien mieć 4–8 cyfr. Dzieci nie powinny go znać.${vn('PIN gồm 4–8 chữ số. Bố mẹ hãy giữ bí mật mã PIN.')}</p><label for="newPin">PIN rodzica / Mã PIN bố mẹ</label><input id="newPin" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password" placeholder="4–8 cyfr / 4–8 chữ số" onkeydown="if(event.key==='Enter')saveInitialPin()"><div id="pinError" class="note bad" style="display:none"></div>${appState.pinHintSeen?'':`<div id="pinRecoveryGuide"><div class="note" style="background:#fff5d9;border:2px solid #e5be48;color:#563c06;font-size:16px;font-weight:750;text-align:center;padding:15px;margin:14px 0 8px">Kod zapasowy na wypadek zapomnienia PIN-u: <b>aloserwis.com</b>.${vn('Mã dự phòng nếu bố mẹ quên PIN: aloserwis.com. Hãy ghi nhớ mã này.')}</div><button class="secondary" style="width:100%" onclick="dismissPinRecoveryGuide()">Dalej / Tiếp tục ➜</button></div>`}<button class="pinSubmit" onclick="saveInitialPin()">Zapisz PIN i wybierz klasę / Lưu PIN và chọn lớp ✓</button></section>`}
function dismissPinRecoveryGuide(){let guide=document.getElementById('pinRecoveryGuide');if(guide){appState.pinHintSeen=true;save();guide.remove()}}
function saveInitialPin(){let pin=document.getElementById('newPin').value,err=document.getElementById('pinError');if(!/^\d{4,8}$/.test(pin)){err.textContent='PIN musi mieć 4–8 cyfr. / PIN cần có 4–8 chữ số.';err.style.display='block';return}appState.pin=pin;save();mode='parent';view='grades';render()}
function parentUnlockPage(){app.innerHTML=`<section class="card hero"><h1>Panel rodzica 🔒</h1>${vn('Chỉ bố mẹ mới được đổi lớp và xem kết quả.')}</section><section class="card pinCard"><h2>Potwierdź PIN rodzica / Nhập PIN bố mẹ</h2><label for="parentPinInput">PIN rodzica / Mã PIN bố mẹ</label><input id="parentPinInput" type="password" inputmode="text" maxlength="64" autocapitalize="off" autocomplete="current-password" placeholder="Wpisz PIN / Nhập PIN" onkeydown="if(event.key==='Enter')verifyParentPIN()"><div id="pinError" class="note bad" style="display:none"></div><button class="pinSubmit" onclick="verifyParentPIN()">Odblokuj / Mở khóa 🔓</button>${appState.selectedGrade?`<button class="secondary pinCancel" onclick="setView('home')">Wróć / Quay lại</button>`:''}</section>`}
async function verifyParentPIN(){let value=document.getElementById('parentPinInput').value,err=document.getElementById('pinError');let backupDigest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(value)))).map(b=>b.toString(16).padStart(2,'0')).join('');if(value!==appState.pin&&backupDigest!=='5447e062bc4fb3cf49250698d771503fa3f1e884cf187962fae5907d174da4b2'){err.textContent='Nieprawidłowy PIN. / PIN không đúng.';err.style.display='block';return}mode='parent';setView(appState.selectedGrade?'parent':'grades')}
function gradePicker(){app.innerHTML=`<section class="card hero"><h1>Wybierz klasę ✨</h1>${vn('Chọn lớp của con để bắt đầu')}<p>Każde dziecko ma własne zadania i zapisane postępy.${vn('Mỗi bé có bộ bài và tiến độ riêng.')}</p></section><section class="card"><h2>Wybierz klasę / Chọn lớp</h2><div class="actions"><button onclick="activateGrade(2)">📘 Klasa 2${vn('Lớp 2')}</button><button onclick="activateGrade(4)">📗 Klasa 4${vn('Lớp 4')}</button></div></section>${guideOpen?`<section class="card guide"><div class="row"><h2>🧭 Jak zacząć? / Hướng dẫn nhanh</h2></div><div class="guideSteps"><div><b>1. Wybierz klasę / Chọn lớp</b>${vn('Chọn lớp 2 hoặc lớp 4 phù hợp với con.')}</div><div><b>2. Wybierz poziom / Chọn cấp độ</b>${vn('Nhấn Graj, sau đó chọn số câu muốn làm.')}</div><div><b>3. Rozwiąż zadanie / Làm bài</b>${vn('Wykonaj działanie. Jeśli utkniesz, naciśnij Podpowiedź / Gợi ý.')}</div></div><p class="muted guideNote">Postępy zapisują się na koncie rodzica. 🔒 PIN rodzica znajdziesz w prawym górnym rogu.${vn('Tiến độ được lưu trên tài khoản bố mẹ. Nút 🔒 ở góc trên bên phải mở khu vực bố mẹ.')}</p><button class="secondary guideClose" onclick="dismissGuide()">Rozumiem / Đã hiểu ✓</button></section>`:''}`}
function dismissGuide(){guideOpen=false;appState.guideSeen=true;save();render()}
function home(){let total=doneCount();app.innerHTML=`<div class="row" style="grid-column:1/-1">${mode==='parent'?`<button class="secondary" onclick="setView('grades')">🔄 Zmień klasę${vn('Đổi lớp')}</button>`:''}<span class="pill">Klasa ${selectedGrade} / Lớp ${selectedGrade}</span></div><section class="card hero"><h1>Witaj, mała matematyczko! ✨</h1>${vn('Chào nhà toán học nhỏ! Mỗi ngày tiến bộ một chút nhé.') }<p>Zdobywaj gwiazdki, rozwiązuj zadania i odkrywaj kolejne krainy!${vn('Tích sao, giải bài tập và khám phá những vùng đất mới!')}</p><div class="row"><b>⭐ ${state.stars} gwiazdek${vn('⭐ '+state.stars+' ngôi sao')}</b><b>🏅 ${total}/${BANK.length} zadań${vn(total+'/'+BANK.length+' bài tập')}</b></div><div class="progress" style="margin-top:12px"><div style="width:${total/2}%"></div></div></section><section class="card"><h2>Wybierz krainę</h2>${vn('Chọn cấp độ học tập')}<div class="section">${LEVELS.map((l,i)=>`<div class="task" style="margin-bottom:9px"><div><b>${l[0]} ${l[1]}</b>${vn(l[2])}<small><span class="pl">${doneCount(i+1)}/40 zadań</span><span class="vn">${doneCount(i+1)}/40 bài</span></small></div><button onclick="openLevel(${i+1})">Graj ▶${vn('Bắt đầu ▶')}</button></div>`).join('')}</div></section><div class="actions"><button class="secondary" onclick="setView('list')">📋 Lista ${BANK.length} zadań ${vn('Danh sách '+BANK.length+' bài')}</button><button class="secondary" onclick="review()">🔁 Powtórz błędy ${vn('Ôn các câu sai')}</button></div>`}
function openLevel(l){filter=String(l);setView('list')}
function list(){let arr=BANK.filter(q=>filter==='all'||filter==='needs'&&state.results[q.id]?.errors>0&&!mastered(q.id)||String(q.level)===filter);app.innerHTML=`<section class="card"><div class="row"><div><h2>Lista zadań 📋</h2>${vn('Danh sách bài tập – chọn một bài để bắt đầu')}</div><button class="secondary" onclick="setView('home')">⌂ Start${vn('Trang chủ')}</button></div><select id="flt" style="width:100%;padding:12px;border-radius:12px;margin:12px 0" onchange="filter=this.value;render()"><option value="all" data-language-pl="Wszystkie zadania (${BANK.length})" data-language-vn="Tất cả bài tập (${BANK.length})"></option>${LEVELS.map((l,i)=>`<option value="${i+1}" data-language-pl="${i+1}. ${l[1]} (40)" data-language-vn="${i+1}. ${l[2]} (40)"></option>`).join('')}<option value="needs" data-language-pl="Do powtórki" data-language-vn="Cần ôn lại"></option></select><div class="list">${arr.map(q=>`<button class="num ${mastered(q.id)?'mastered':state.results[q.id]?.errors?'needs':''}" onclick="start(${q.id})">${q.id}${mastered(q.id)?' ✓':''}</button>`).join('')||'<p>Brak zadań do powtórki! / Không có bài cần ôn! 🎉</p>'}</div><p class="muted" style="font-size:12px">🟢 Opanowane / Đã thành thạo · 🟠 Do powtórki / Cần ôn · 🔵 Nowe / Mới</p></section>`;document.getElementById('flt').value=filter}
function review(){filter='needs';setView('list')}
let questionStartedAt=Date.now();
function start(id){questionStartedAt=Date.now();active=id;phase=0;chosen='';hints=0;calcHints=0;wrong=0;finished=false;setView('quiz')}
function quiz(){const q=BANK[active-1],lev=LEVELS[q.level-1];if(q.first===q.expr&&phase===0)phase=1;let choicePool=[q.first,...findDistractors(q)];app.innerHTML=`<div class="row" style="margin-bottom:10px"><button class="secondary" onclick="setView('list')">← Lista zadań${vn('Danh sách bài')}</button><span class="pill">${lev[0]} ${lev[1]}<span class="vn">${lev[2]}</span> · ${active}/${BANK.length}</span></div><section class="card"><h2>Zadanie ${active}</h2>${vn('Bài số '+active)}${q.word?`<p style="font-size:21px;line-height:1.7">${q.word.replaceAll('<strong>','<strong class="key">')}</p>${vn(q.vn)}`:''}<div class="big">${q.expr} = ?</div><div class="progress"><div style="width:${phase===0?20:phase===1?60:100}%"></div></div><div id="quizBody" class="section"></div></section>`;quizBody(choicePool)}
function findDistractors(q){let all=BANK.filter(x=>x.id!==q.id&&x.level===q.level).map(x=>x.first);let res=[];for(let s of all){if(s!==q.first&&!res.includes(s))res.push(s);if(res.length===3)break}return res}
function quizBody(pool){const q=BANK[active-1],el=document.getElementById('quizBody');if(phase===0){let opts=[...pool].sort((a,b)=>((a.length*13+a.charCodeAt(0)+active*7)%17)-((b.length*13+b.charCodeAt(0)+active*7)%17));el.innerHTML=`<h3>Co obliczamy najpierw?</h3>${vn('Phép tính nào cần làm trước?')}<div class="options section">${opts.map((o,i)=>`<button onclick="chooseFirst(${i})">${o}</button>`).join('')}</div><div class="note" id="feedback" style="display:none"></div><div class="actions"><button class="secondary" onclick="hint()">💡 Podpowiedź${vn('Gợi ý')}</button></div>`;window.opts=opts}
else if(phase===1){el.innerHTML=`<h3>Oblicz wynik</h3>${vn('Tính kết quả')}<label for="result">Twoja odpowiedź / Đáp án của con</label><input id="result" inputmode="numeric" type="number" autocomplete="off" placeholder="Wpisz wynik / Nhập kết quả" onkeydown="if(event.key==='Enter')checkAnswer()"><div id="feedback" class="note" style="display:none"></div><div class="actions"><button class="secondary" onclick="hint()">💡 Podpowiedź${vn('Gợi ý')}</button><button onclick="checkAnswer()">Sprawdź ✓${vn('Kiểm tra ✓')}</button></div>`;document.getElementById('result').focus()}
else{el.innerHTML=`<div class="note good"><h2>🎉 Brawo! Dobra robota!</h2>${vn('Giỏi lắm! Con đã hoàn thành bài.') }<b>⭐ ${wrong===0&&hints===0?20:10} punktów${vn('⭐ '+(wrong===0&&hints===0?20:10)+' điểm')}</b></div><h3 class="section">Rozwiązanie krok po kroku</h3>${vn('Lời giải từng bước')} ${q.steps.map((s,i)=>`<div class="step">${i+1}. ${s}</div>`).join('')}<div class="actions"><button class="secondary" onclick="setView('list')">📋 Lista${vn('Danh sách bài')}</button><button onclick="start(${active===BANK.length?1:active+1})">Następne zadanie →${vn('Bài tiếp theo →')}</button></div>`}}
function chooseFirst(i){const q=BANK[active-1],o=window.opts[i];if(o===q.first){phase=1;quizBody();return}wrong++;record(false,'first',o);let f=document.getElementById('feedback');f.style.display='block';f.className='note bad';f.innerHTML=`<b>Spróbuj jeszcze raz! 🌼</b>${vn('Chưa đúng. Hãy thử lại.')}<p>${q.expr.includes('(')?'Najpierw obliczamy działanie w nawiasie.':'Mnożenie i dzielenie wykonujemy przed dodawaniem i odejmowaniem. Działania tego samego rzędu liczymy od lewej do prawej.'}</p>${vn(q.expr.includes('(')?'Tính trong ngoặc trước.':'Thực hiện nhân và chia trước cộng và trừ. Các phép tính cùng thứ tự được làm từ trái sang phải.')} `}
function hint(){hints++;const q=BANK[active-1],f=document.getElementById('feedback');f.style.display='block';f.className='note';let s=phase===0?(q.expr.includes('(')?'Poszukaj nawiasu ( ).':'Najpierw mnożenie lub dzielenie; działania tego samego rzędu licz od lewej do prawej.'):hints<2?`Pierwszy krok: ${q.steps[0]}`:q.steps.slice(0,-1).join(' → ');let vi=phase===0?(q.expr.includes('(')?'Hãy tìm phép tính trong ngoặc.':'Nhân hoặc chia trước; các phép tính cùng thứ tự làm từ trái sang phải.'):hints<2?'Bước đầu tiên: '+q.steps[0]:'Xem các bước trung gian: '+q.steps.slice(0,-1).join(' → ');f.innerHTML=`<b>💡 Podpowiedź ${hints} / Gợi ý ${hints}</b><p>${s}</p>${vn(vi)}`}
function record(ok,kind,given){let r=state.results[active]||{attempts:0,errors:0,mastered:false};r.attempts++;if(!ok)r.errors++;if(ok)r.mastered=true;r.last=new Date().toISOString();state.results[active]=r;state.events.push({id:active,ok,kind,given,at:r.last,hints,durationSeconds:Math.max(0,Math.floor((Date.now()-questionStartedAt)/1000))});if(state.events.length>2000)state.events=state.events.slice(-2000);save()}
function checkAnswer(){let input=document.getElementById('result'),v=input.value.trim();if(!v)return;const q=BANK[active-1];if(Number(v)===q.answer){state.skipped=skippedIds().filter(id=>Number(id)!==active);record(true,'answer',v);state.stars+=wrong===0&&hints===0?20:10;save();phase=2;quizBody();return}wrong++;record(false,'answer',v);let f=document.getElementById('feedback');f.style.display='block';f.className='note bad';let step=wrong===1?q.steps[0]:q.steps.slice(0,Math.min(wrong,q.steps.length-1)).join(' → ');f.innerHTML=`<b>Jeszcze nie! Spróbuj ponownie 🌼</b>${vn('Chưa đúng. Con thử lại nhé.')}<p><b>Wskazówka:</b> ${step}</p>${vn('Kiểm tra lại phép tính theo thứ tự. Không cần vội.')}`;input.select()}

const quizBodyBeforeSkip=quizBody;
quizBody=function(pool){quizBodyBeforeSkip(pool);if(phase>=2)return;const groups=app.querySelectorAll("#quizBody .actions");const target=groups[groups.length-1];if(!target)return;const button=document.createElement("button");button.type="button";button.className="outline";button.innerHTML="⏭ Pomiń zadanie"+vn("Bỏ qua câu này");button.onclick=skipQuestion;target.appendChild(button)}
const homeBeforeSkipReminder=home;
home=function(){homeBeforeSkipReminder();const skipped=pendingSkipped();if(!skipped.length)return;const remaining=BANK.filter(q=>!mastered(q.id)&&!skipped.some(x=>x.id===q.id)).length;const card=document.createElement("section");card.className="card";card.innerHTML='<div class="note '+(remaining===0?'good':'')+'"><b>'+(remaining===0?'🎉 Świetnie! Wróć do pominiętych zadań.':'📝 Pominięte zadania: '+skipped.length)+'</b>'+vn(remaining===0?'Con đã hoàn thành các bài khác! Giờ hãy quay lại các câu đã bỏ qua.':'Con có thể quay lại các câu đã bỏ qua bất cứ lúc nào.')+'<div class="actions"><button id="resumeSkippedButton">↩ Wróć do pominiętych ('+skipped.length+')'+vn('Làm lại câu đã bỏ qua')+'</button></div></div>';app.insertBefore(card,app.children[2]||null);card.querySelector("#resumeSkippedButton").onclick=resumeSkipped}
function strategyHint(q){const m=q.first.match(/^(\d+)\s*([+−\-×:])\s*(\d+)$/);if(!m)return '<b>Podziel działanie na mniejsze kroki.</b>'+vn('Hãy tách phép tính thành những bước nhỏ hơn.');const a=Number(m[1]),op=m[2],b=Number(m[3]);let text="",vi="",symbol=op==="-"?"−":op;
if(op==="+"&&b>=10){const tens=Math.floor(b/10)*10,ones=b%10;text="Rozbij "+b+" na dziesiątki i jedności: "+a+" + "+tens+" + "+ones+". Dodaj najpierw dziesiątki.";vi="Tách "+b+" thành chục và đơn vị: "+a+" + "+tens+" + "+ones+". Cộng hàng chục trước."}
else if(op==="+"){const jump=10-(a%10);text="Skocz najpierw do pełnej dziesiątki: "+a+" + "+Math.min(jump,b)+(b>jump?" + "+(b-jump):"")+".";vi="Nhảy đến chục tròn gần nhất trước: "+a+" + "+Math.min(jump,b)+(b>jump?" + "+(b-jump):"")+"."}
else if(op==="−"||op==="-"){if(b>=10){const tens=Math.floor(b/10)*10,ones=b%10;if(ones>a%10&&ones&&a%10>0){const bridge=a%10;text="Odejmij dziesiątki, potem przejdź przez pełną dziesiątkę: "+a+" − "+bridge+" = "+(Math.floor(a/10)*10)+"; teraz odejmij jeszcze "+(b-bridge)+".";vi="Trừ hàng chục trước, rồi trừ qua chục tròn: "+a+" − "+bridge+" = "+(Math.floor(a/10)*10)+"; sau đó trừ tiếp "+(b-bridge)+"."}else{text="Rozbij "+b+" na dziesiątki i jedności: "+a+" − "+tens+" − "+ones+". Odejmuj etapami.";vi="Tách "+b+" thành chục và đơn vị: "+a+" − "+tens+" − "+ones+". Trừ từng bước."}}else{const bridge=a%10;text="Użyj skoku do pełnej dziesiątki: "+a+" − "+Math.min(bridge,b)+(b>bridge?" − "+(b-bridge):"")+".";vi="Dùng cách nhảy qua chục tròn: "+a+" − "+Math.min(bridge,b)+(b>bridge?" − "+(b-bridge):"")+"."}}
else if(op==="×"&&Math.max(a,b)>=10){const big=a>=10?a:b,small=a>=10?b:a,tens=Math.floor(big/10)*10,ones=big%10;text="Rozbij "+big+" na dziesiątki i jedności: "+tens+" × "+small+" oraz "+ones+" × "+small+", a potem dodaj wyniki.";vi="Tách "+big+" thành chục và đơn vị: tính "+tens+" × "+small+" và "+ones+" × "+small+", rồi cộng hai kết quả."}
else if(op==="×"){const big=Math.max(a,b),small=Math.min(a,b);if(big>=6){text="Zamień "+big+" × "+small+" na łatwiejsze: 5 × "+small+" + "+(big-5)+" × "+small+". Pomyśl o równych grupach.";vi="Đổi "+big+" × "+small+" thành phép dễ hơn: 5 × "+small+" + "+(big-5)+" × "+small+". Hãy hình dung các nhóm bằng nhau."}else{text="Pokaż "+a+" × "+b+" jako "+a+" równych grup po "+b+". Narysuj kropki w rzędach.";vi="Hình dung "+a+" × "+b+" là "+a+" nhóm, mỗi nhóm có "+b+" vật. Vẽ chấm thành các hàng."}}
else{text="Użyj mnożenia odwrotnego: znajdź liczbę, dla której "+b+" × ? = "+a+". Możesz narysować równe grupy.";vi="Dùng phép nhân ngược: tìm số sao cho "+b+" × ? = "+a+". Có thể vẽ các nhóm bằng nhau."}
const column=(op==="+"||op==="−"||op==="-"||op==="×")?'<div style="display:inline-block;margin-top:8px;padding:8px 14px;background:#fff;border-radius:9px;font:700 22px/1.35 monospace;text-align:right;min-width:90px"><div>'+a+'</div><div>'+symbol+' '+b+'</div><div style="border-top:2px solid #333;margin-top:3px">&nbsp;</div></div>':op===":"?'<div style="display:inline-block;margin-top:8px;padding:10px 14px;background:#fff;border-radius:9px;font:700 22px/1.35 monospace"><div style="display:grid;grid-template-columns:auto auto;align-items:end;gap:5px"><div style="text-align:right;padding-right:6px">'+b+'</div><div style="border-top:2px solid #333;border-left:2px solid #333;padding:2px 10px">'+a+'</div><div></div><div style="border-top:1px solid #555;text-align:center">?</div></div></div>':"";

return '<b>🧠 Sprytny sposób / Cách tính dễ hiểu</b><p>'+text+'</p>'+vn(vi)+(column?'<p>'+columnTitle+'</p>'+column:"")}
hint=function(){hints++;const q=BANK[active-1],f=document.getElementById("feedback");if(!f)return;f.style.display="block";f.className="note";let content;if(phase===0){const pl=q.expr.includes("(")?"Najpierw policz działanie w nawiasie.":"Mnożenie i dzielenie przed dodawaniem i odejmowaniem; działania tego samego rzędu od lewej do prawej.",vi=q.expr.includes("(")?"Tính trong ngoặc trước.":"Nhân và chia trước cộng trừ; phép tính cùng thứ tự làm từ trái sang phải.";content="<p>"+pl+"</p>"+vn(vi)}else{calcHints++;if(calcHints===1){content=strategyHint(q)}else if(calcHints===2){content="<p><b>Pierwszy krok / Bước đầu tiên:</b> "+q.steps[0]+"</p>"+vn("Làm phép tính đầu tiên, sau đó mới chuyển sang bước tiếp theo.")}else{content="<p>"+q.steps.slice(0,Math.min(calcHints-1,q.steps.length)).join(" → ")+"</p>"+vn("Xem tiếp từng bước giải.")}}f.innerHTML="<b>💡 Podpowiedź "+hints+" / Gợi ý "+hints+"</b>"+content}
function formatDuration(seconds){if(!Number.isFinite(seconds))return '—';let mins=Math.floor(seconds/60),secs=seconds%60;return mins?`${mins} min ${String(secs).padStart(2,'0')} s`:`${secs} s`}
function parentQuestion(id){const q=BANK.find(x=>Number(x.id)===Number(id));if(!q)return "—";let expression=`<div><b>${q.expr} = ?</b></div>`;return q.word?`${q.word}${vn(q.vn)}${expression}`:expression}
function parent(){if(mode!=='parent'){setView('home');return}let total=doneCount(),errors=Object.values(state.results).reduce((s,r)=>s+(r.errors||0),0);app.innerHTML=`<section class="card"><div class="row"><div><h2>🔐 Panel rodzica</h2>${vn('Khu vực theo dõi dành cho bố mẹ')}</div><button class="secondary" onclick="mode='child';setView('home')">Zamknij 🔒${vn('Đóng 🔒')}</button></div><div class="grid section"><div class="stat"><b>${total}/${BANK.length}</b>Opanowane${vn('Đã thành thạo')}</div><div class="stat"><b>${state.stars}</b>Gwiazdki${vn('Ngôi sao')}</div><div class="stat"><b>${errors}</b>Błędy${vn('Số lần sai')}</div><div class="stat"><b>${state.events.length}</b>Próby${vn('Lượt làm')}</div></div><h3 class="section">Postępy według poziomu</h3>${vn('Tiến độ theo cấp độ')}${LEVELS.map((l,i)=>`<div style="margin:12px 0"><div class="row"><b>${l[0]} ${l[1]}${vn(l[2])}</b><span>${doneCount(i+1)}/40</span></div><div class="progress"><div style="width:${doneCount(i+1)*2.5}%"></div></div></div>`).join('')}<h3 class="section">Ostatnie odpowiedzi</h3>${vn('Các câu trả lời gần đây')}<div style="overflow:auto"><table><thead><tr><th>Data / Ngày</th><th>Nr / Số</th><th>Pytanie / Câu hỏi</th><th>Wynik / Kết quả</th><th>Podpowiedzi / Số gợi ý</th><th>Czas / Thời gian</th><th>Odpowiedź / Câu trả lời</th></tr></thead><tbody>${state.events.slice(-30).reverse().map(e=>`<tr><td>${fmtDate(e.at)}</td><td>${e.id}</td><td>${parentQuestion(e.id)}</td><td>${e.ok?'✓':'✕'}</td><td>${e.hints===undefined?'—':e.hints}</td><td>${formatDuration(e.durationSeconds)}</td><td>${String(e.given).replace(/[&<>"']/g,'')}</td></tr>`).join('')}</tbody></table></div><div class="actions"><button class="secondary" onclick="exportPDF()">📄 Zapisz raport jako PDF${vn('Xuất báo cáo PDF')}</button><button class="secondary" onclick="changePIN()">🔑 Zmień PIN${vn('Đổi PIN')}</button></div><div class="actions"><button class="outline" onclick="resetProgress()">Usuń postępy${vn('Xóa kết quả')}</button></div></section>`}
function exportPDF(){const oldTitle=document.title;document.title='Math Adventure - Klasa '+selectedGrade+' - '+new Date().toISOString().slice(0,10);window.addEventListener('afterprint',()=>{document.title=oldTitle},{once:true});window.print()}
function changePIN(){let p=prompt('Nowy PIN (4–8 cyfr) / Đặt PIN mới (4–8 chữ số):');if(p===null)return;if(!/^\d{4,8}$/.test(p)){alert('PIN musi mieć 4–8 cyfr. / PIN cần có 4–8 chữ số.');return}appState.pin=p;save();alert('PIN zapisany. / Đã lưu PIN.')}
function resetProgress(){if(confirm('Usunąć wszystkie wyniki? / Xóa toàn bộ kết quả?')){state.results={};state.events=[];state.stars=0;state.skipped=[];save();render()}}
function resetAllData(){if(!confirm('Zresetować postępy i historię obu klas (2 i 4)? PIN rodzica pozostanie bez zmian. / Đặt lại toàn bộ tiến độ và lịch sử của cả lớp 2 và lớp 4? PIN bố mẹ sẽ được giữ nguyên.'))return;appState.profiles={'2':freshProfile(),'4':freshProfile()};state=appState.profiles[selectedGrade];save();setView('parent')}
let deferredInstallPrompt=null;
const installButton=document.getElementById('installBtn');
function isAppleMobile(){return /iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}
function isInstalledApp(){return navigator.standalone===true||window.matchMedia('(display-mode: standalone)').matches}
function updateInstallButton(){if(isInstalledApp()){installButton.classList.add('hidden');return}if(isAppleMobile()||deferredInstallPrompt)installButton.classList.remove('hidden')}
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstallPrompt=event;updateInstallButton()});

updateInstallButton();

const FRESH_LOAD_KEY='mathAdventureFreshLoadPending';
function loadLatestVersion(){try{sessionStorage.setItem(FRESH_LOAD_KEY,'1')}catch{}let url=new URL(location.href);url.searchParams.set('update',String(Date.now()));location.replace(url.toString())}

const renderParentPanelBase=parent;
parent=function(){renderParentPanelBase();if(mode!=='parent')return;const card=app.querySelector('.card');if(!card)return;const section=document.createElement('section');section.className='section';section.innerHTML=`<h3>Ustawienia aplikacji / Cài đặt ứng dụng</h3>${vn('Bố mẹ có thể đặt lại dữ liệu học hoặc tải lại phiên bản mới nhất.') }<div class="actions"><button class="outline" onclick="resetAllData()">↺ Zacznij od początku${vn('Đặt lại dữ liệu từ đầu')}</button><button class="secondary" onclick="loadLatestVersion()">⬇ Wczytaj najnowszą wersję${vn('Tải phiên bản mới nhất')}</button></div>`;card.appendChild(section)};
document.getElementById('parentBtn').addEventListener('click',()=>{if(mode==='parent'){setView('parent');return}if(!appState.pin){view='setup';render();return}view='unlock';render()});
let mathLanguage;try{mathLanguage=localStorage.getItem('mathAdventureLanguage')||'sn'}catch{mathLanguage='sn'}
function previousLanguagePair(node){let prev=node.previousSibling;while(prev&&prev.nodeType===1&&prev.classList.contains('vn'))prev=prev.previousSibling;while(prev&&prev.nodeType===3&&!prev.textContent.trim())prev=prev.previousSibling;return prev}
function splitLanguageSlashPairs(root){const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(const node of nodes){const parent=node.parentElement;if(!parent||parent.closest('script,style,textarea,option,#languagePicker,.pl,.vn'))continue;const at=node.textContent.indexOf(' / ');if(at<0)continue;const left=node.textContent.slice(0,at),right=node.textContent.slice(at+3);if(!left.trim()||!right.trim())continue;const pl=document.createElement('span'),vn=document.createElement('span');pl.className='pl';vn.className='vn';pl.textContent=left;vn.textContent=right;node.parentNode.insertBefore(pl,node);node.parentNode.insertBefore(vn,node);node.remove()}}
function markLanguagePairs(root){splitLanguageSlashPairs(root);for(const vi of root.querySelectorAll('.vn')){if(vi.closest('#languagePicker')||vi.id==='subTitle')continue;const prev=previousLanguagePair(vi);if(!prev)continue;if(prev.nodeType===1&&prev.classList.contains('pl'))continue;if(prev.nodeType===3&&prev.textContent.trim()){const span=document.createElement('span');span.className='pl';prev.parentNode.insertBefore(span,prev);span.appendChild(prev);continue}if(prev.nodeType===1&&/^(H1|H2|H3|P|LABEL|BUTTON|SMALL|B|STRONG|SPAN|EM|LI|TD|TH)$/.test(prev.tagName))prev.classList.add('pl')}}
function pairedLanguageHTML(value){const text=String(value??''),at=text.indexOf(' / ');if(at<0)return escapeLanguageText(text);const pl=text.slice(0,at),vnText=text.slice(at+3);return `<span class="pl">${escapeLanguageText(pl)}</span><span class="vn">${escapeLanguageText(vnText)}</span>`}
function escapeLanguageText(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function pickLanguageText(value){const text=String(value??''),at=text.indexOf(' / ');if(at<0)return text;const pl=text.slice(0,at),vnText=text.slice(at+3);return mathLanguage==='pl'?pl:mathLanguage==='vn'?vnText:`${pl} · ${vnText}`}
function renderMathSubtitle(){const el=document.getElementById('subTitle');if(!el)return;const auth=document.getElementById('app')?.classList.contains('view-auth'),key=`${auth?'auth':view}:${selectedGrade||''}:${typeof mathCloudAuthStep==='undefined'?'':mathCloudAuthStep}`;if(el.dataset.languageView===key)return;const values=auth?(typeof mathCloudAuthStep!=='undefined'&&mathCloudAuthStep==='verify'?['Kod aktywacyjny','Mã kích hoạt']:['Konto rodzica','Tài khoản phụ huynh']):view==='setup'?['Konfiguracja PIN-u rodzica','Thiết lập PIN bố mẹ']:view==='unlock'?['Potwierdź PIN rodzica','Xác nhận PIN bố mẹ']:view==='grades'?['Wybierz klasę','Chọn lớp']:view==='home'||view==='list'||view==='quiz'||view==='parent'?[`Przygoda matematyczna · Klasa ${selectedGrade}`,`Phiêu lưu toán học · Lớp ${selectedGrade}`]:['Konto rodzica','Tài khoản phụ huynh'];el.classList.remove('vn');el.dataset.languageView=key;el.innerHTML=`<span class="pl">${values[0]}</span><span class="vn">${values[1]}</span>`}
function applyLanguageMode(){if(!document.body)return;document.documentElement.dataset.language=mathLanguage;document.documentElement.lang=mathLanguage==='vn'?'vi':'pl';markLanguagePairs(document.body);renderMathSubtitle();for(const vi of document.querySelectorAll('.vn')){const pl=previousLanguagePair(vi);if(!pl||pl.nodeType!==1||!pl.classList.contains('pl'))continue;const style=getComputedStyle(pl);const bilingual=mathLanguage==='sn';vi.style.fontSize=bilingual?`${parseFloat(style.fontSize)*.86}px`:style.fontSize;vi.style.color=style.color;vi.style.fontWeight=style.fontWeight;vi.style.lineHeight=style.lineHeight;vi.style.opacity=bilingual?'.78':''}for(const button of document.querySelectorAll('.languagePicker [data-language]'))button.setAttribute('aria-checked',String(button.dataset.language===mathLanguage));updateLanguagePicker();for(const option of document.querySelectorAll('option[data-language-pl][data-language-vn]')){const pl=option.dataset.languagePl,vi=option.dataset.languageVn;option.textContent=mathLanguage==='pl'?pl:mathLanguage==='vn'?vi:`${pl} / ${vi}`}for(const el of document.querySelectorAll('[title],[aria-label],input[placeholder]'))for(const attr of ['title','aria-label','placeholder'])if(el.hasAttribute(attr)){const sourceKey='languageSource'+attr.replace(/[^a-z]/gi,'');if(!el.dataset[sourceKey])el.dataset[sourceKey]=el.getAttribute(attr);el.setAttribute(attr,pickLanguageText(el.dataset[sourceKey]))};document.title=mathLanguage==='vn'?'Phiêu lưu Toán học · Lớp 2 và 4':mathLanguage==='pl'?'Matematyczna Przygoda · Klasy 2 i 4':'Matematyczna Przygoda · Phiêu lưu Toán học'}
function updateLanguagePicker(){const current=document.getElementById('currentLanguageFlags'),label=document.getElementById('currentLanguageLabel'),toggle=document.getElementById('languageToggle');if(!current||!label||!toggle)return;const choices={pl:['🇵🇱','PL'],vn:['🇻🇳','VN'],sn:['🇵🇱🇻🇳','SN']};current.textContent=choices[mathLanguage][0];label.textContent=choices[mathLanguage][1];toggle.setAttribute('aria-label',mathLanguage==='pl'?'Zmień język · Polski':mathLanguage==='vn'?'Đổi ngôn ngữ · Tiếng Việt':'Język · Ngôn ngữ · Song ngữ');const menu=document.getElementById('languageMenu');if(menu)menu.querySelectorAll('[data-language]').forEach(button=>button.setAttribute('aria-checked',String(button.dataset.language===mathLanguage)))}
function toggleLanguageMenu(){const menu=document.getElementById('languageMenu'),toggle=document.getElementById('languageToggle');if(!menu||!toggle)return;menu.hidden=!menu.hidden;toggle.setAttribute('aria-expanded',String(!menu.hidden))}
function closeLanguageMenu(){const menu=document.getElementById('languageMenu'),toggle=document.getElementById('languageToggle');if(menu)menu.hidden=true;if(toggle)toggle.setAttribute('aria-expanded','false')}
document.addEventListener('click',event=>{const picker=document.getElementById('languagePicker');if(picker&&!picker.contains(event.target))closeLanguageMenu()});document.addEventListener('keydown',event=>{if(event.key==='Escape')closeLanguageMenu()});
function setMathLanguage(language){if(!['pl','vn','sn'].includes(language))return;mathLanguage=language;try{localStorage.setItem('mathAdventureLanguage',language)}catch{}closeLanguageMenu();applyLanguageMode()}
const languageAlert=window.alert.bind(window),languageConfirm=window.confirm.bind(window),languagePrompt=window.prompt.bind(window);window.alert=value=>languageAlert(pickLanguageText(value));window.confirm=value=>languageConfirm(pickLanguageText(value));window.prompt=(value,initial)=>languagePrompt(pickLanguageText(value),initial);
